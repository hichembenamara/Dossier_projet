name: CI

# Pipeline d'intégration continue — blocs 3/4 (produire & maintenir).
# À chaque push / pull request : lint, tests backend et ETL, build frontend, tests de bout en bout Playwright.
on:
  push:
    branches: [maintenance, main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend · tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests autonomes (SQLite en mémoire) : aucune base externe requise.
      MONGO_ENABLED: "false"
      JWT_SECRET_KEY: ci-test-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  frontend-build:
    name: Frontend · build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: mkdir -p public && npm run build

  etl-tests:
    name: ETL · tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthai_etl
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r ../backend/requirements.txt
      - name: Run tests
        run: pytest -q

  lint:
    name: Lint · ruff + eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff check
        run: pipx run ruff check backend healthai_etl
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: npm run lint
        working-directory: frontend
        run: npm run lint

  e2e:
    name: E2E · Playwright sur la pile Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    env:
      MONGO_ENABLED: "true"
      AI_ENABLE_EXTERNAL_CALLS: "false"
      JWT_SECRET_KEY: ci-e2e-secret-key-with-enough-length-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then echo "API ready"; exit 0; fi
            sleep 5
          done
          echo "API not ready"; docker compose logs backend | tail -100; exit 1
      - name: Load the ETL data
        run: docker compose --profile etl run --rm etl
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
